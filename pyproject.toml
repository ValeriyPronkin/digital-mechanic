[project]
name = "service"
version = "0.1.0"
description = "Каркас сервиса хакатона: /health, страница, тесты (заменить описание после задания)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pdfplumber>=0.11.11",
    "pillow>=13.0.0",
    "pymorphy3>=2.0.6",
    "pypdfium2>=5.15.2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "boto3>=1.44.12",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/service"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["kb", "vendor"]  # kb — локальная папка людей; vendor — заглушки заказчика как есть

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # кириллица в строках и комментариях — норма

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pdfplumber.*", "pypdfium2", "pypdfium2.*", "pymorphy3", "pymorphy3.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
