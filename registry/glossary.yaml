# 1·0·1·0·1·1; «аварийное давление масла» 0·0·1·0·4·16; «остановить двигатель» 1·1·2·0·2·2; «контроль за
# работой двигателя» 0·0·3·0·0·0.
ехать:
  - не допускается эксплуатация
  - аварийное давление масла
  - остановить двигатель
  - контроль за работой двигателя

# «можно ли своим ходом перегнать машину на базу». «перегнать» 0·0·0·0·0·0; «не допускается эксплуатация»
# 1·0·1·0·1·1; «аварийное давление масла» 0·0·1·0·4·16; «остановить двигатель» 1·1·2·0·2·2; «буксировка»
# 4·0·1·0·0·0.
перегнать:
  - не допускается эксплуатация
  - аварийное давление масла
  - остановить двигатель
  - буксировка

# «гофра» 1·0·0·0·0·0. «гофрированный шланг» 0·0·0·0·0·2 (the air intake hose of the ЗМЗ-409). A live
# question with the shop word found nothing on that engine.
гофра:
  - гофрированный шланг

# «мороз»: 0 pages. The manuals write «отрицательная температура» 3·0·0·0·0·1 and «температура
# окружающего воздуха» 6·1·9·1·2·5.
мороз:
  - отрицательная температура
  - температура окружающего воздуха

# --- Parts that must not be fitted twice

# The shop asks «можно ли ставить повторно», «использовать повторно», «они одноразовые?». The manuals name
# it differently in each: «разового монтажа» 0·0·0·0·0·3 (the appendix «Перечень деталей разового монтажа»
# of ЗМЗ-409), «одноразового использования» 0·0·0·61·0·0 (the operation cards of ЯМЗ-536 РК),
# «повторное использование» 1·2·1·3·1·2, «количество использования» 0·0·0·0·0·3 (how many times the
# connecting rod bolts of ЗМЗ-409 may be used).
# The keys name the sense, fitting or using a part again, and not the bare «повторно» or «второй раз»:
# in a shop those mostly mean to tighten or to check again («повторно подтянуть болты головки»,
# «проверить зазор второй раз»), and with them as keys such a question got the list of single-use parts
# among its pages (the review of #109).
ставить повторно: &single_use
  - разового монтажа
  - одноразового использования
  - повторное использование
  - количество использования
использовать повторно: *single_use
повторно использовать: *single_use
повторное использование:
  - разового монтажа
  - одноразового использования
  - количество использования
повторная установка: *single_use
одноразовый:
  - разового монтажа
  - повторное использование
  - количество использования
