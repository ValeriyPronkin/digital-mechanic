# Coverage registry: for every engine × fault type of the fleet, whether this engine's manuals cover the
# unit, the page that proves a design fact, and the pages worth reading. `app/coverage.py` reads this file;
# the fault guide tool and the ticket precondition rely on it (docs/spec.md §4.3).
#
# AWAITING EXPERT SIGN-OFF. Every cell was decided by reading the pages listed (26 November 2026), not by
# search; the classes await the domain expert (issue #19). Until then signed_off_by stays null.
#
# Decision rule. (1) Does the unit exist on this engine? No → not_covered, with the page that states the
# design fact. (2) Does the manual have a section, checks or norms for it? Only a troubleshooting row or only
# removal and installation → general_inspection_only; otherwise covered.
#
# Pages are PDF pages (line N of data/seed/pages/<manual>.jsonl), ordered by usefulness: the guide attaches
# the text of the first three. `why` says what is on the page. `note` holds conditions the agent must state;
# it carries no norms, so every number in an answer still comes from a cited page.
# Draft step: `python -m pipeline.coverage_scan`.
signed_off_by: null

