# Стенд для жюри: постоянный URL из main в Yandex Cloud Serverless Containers.
# Push в main (или ручной запуск) → образы → заглушки заказчика stand-<репозиторий>-ml и -toir →
# основной контейнер stand-<репозиторий> с их адресами в MOCK_ML_URL / MOCK_TOIR_URL → проверка /health
# и смоук сценариев С1/С3 без модели → ссылки в сводке запуска. Контейнеры не удаляются: URL не меняются.
# Сроки хакатона: работает с 28.11 10:00 до 23:59 3.12; до 15.12 — поднять за 24 ч по запросу
# (Actions → Stand → Run workflow).
# Переменные приложения (ключи моделей) — секрет APP_ENV, строки KEY=VALUE; в логи не печатаются.
# Без переменной YC_REGISTRY_ID job пропускается, CI не краснеет.
# Индекс руководств (D-9, #6): переменная S3_BUCKET — имя частного бакета; контейнер при старте скачивает
# index/LATEST по IAM-токену своего сервисного аккаунта (YC_SA_ID, роль storage.viewer на бакет).
# Статический ключ в контейнер не передаётся: строки S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY из APP_ENV отбрасываются.
name: Stand

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      min_instances:
        description: "Тёплые экземпляры (1 — на время питча, без холодного старта; 0 — экономия)"
        required: false
        default: ""
      logs_minutes:
        description: "Только прочитать журнал контейнеров стенда (Cloud Logging) за N минут, без деплоя"
        required: false
        default: ""
      voice_live:
        description: "Прогнать голос на стенде как страница: WAV → распознавание → чат → озвучка (≈0,5 ₽); с logs_minutes — без деплоя"
        type: boolean
        default: false
      c1_live:
        description: "После деплоя прогнать С1 на настоящей модели: вопрос → заявка (≈0,4 ₽)"
        type: boolean
        default: false

permissions:
  contents: read

# Деплои стенда идут по одному, свежий не отменяет начатый.
concurrency:
  group: stand
  cancel-in-progress: false

env:
  YC_FOLDER_ID: ${{ vars.YC_FOLDER_ID }}
  YC_REGISTRY_ID: ${{ vars.YC_REGISTRY_ID }}
  YC_SA_ID: ${{ vars.YC_SA_ID }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  YANDEX_FOLDER_ID: ${{ vars.YANDEX_FOLDER_ID }}
  # Ответ агента бывает дольше 30 с превью: даём 120 с.
  STAND_TIMEOUT: ${{ vars.STAND_TIMEOUT || '120s' }}
  STAND_MEMORY: ${{ vars.STAND_MEMORY || '1GB' }}
  STAND_MIN_INSTANCES: ${{ inputs.min_instances || vars.STAND_MIN_INSTANCES || '0' }}

jobs:
  deploy:
    name: Стенд — деплой
    if: vars.YC_REGISTRY_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Имена контейнеров
        run: |
          set -eu
          # Имя в Yandex Cloud: строчные буквы, цифры, дефис, до 63 символов (с суффиксом -toir).
          NAME="stand-$(printf '%s' "${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | cut -c1-52)"
          NAME="${NAME%-}"
          {
            echo "CONTAINER_NAME=$NAME"
            echo "ML_NAME=$NAME-ml"
            echo "TOIR_NAME=$NAME-toir"
          } >> "$GITHUB_ENV"
          echo "Контейнеры: $NAME, $NAME-ml, $NAME-toir"

      - name: Ключ сервисного аккаунта во временный файл
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          set -eu
          umask 077
          KEY_FILE="$RUNNER_TEMP/yc-sa-key.json"
          printf '%s' "$YC_SA_JSON_CREDENTIALS" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      - name: Установить и настроить yc CLI
        run: |
          set -eu
          curl -sSfL https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o "$RUNNER_TEMP/yc-install.sh"
          bash "$RUNNER_TEMP/yc-install.sh" -i "$HOME/yandex-cloud" -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          YC="$HOME/yandex-cloud/bin/yc"
          "$YC" config profile create stand >/dev/null
          "$YC" config set service-account-key "$KEY_FILE"
          "$YC" config set folder-id "$YC_FOLDER_ID"
          "$YC" version

      - name: Журнал контейнеров стенда (только чтение)
        if: inputs.logs_minutes != ''
        env:
          LOGS_MINUTES: ${{ inputs.logs_minutes }}
        run: |
          set -eu
          case "$LOGS_MINUTES" in ''|*[!0-9]*) echo "logs_minutes — целое число минут" >&2; exit 1 ;; esac
          echo "Группы журнала каталога:"
          yc logging group list --format json | jq -r '.[] | "\(.id) \(.name) retention=\(.retention_period)"' || true
          for name in "$CONTAINER_NAME" "$ML_NAME" "$TOIR_NAME"; do
            id=$(yc serverless container get --name "$name" --format json | jq -r '.id')
            rev=$(yc serverless container revision list --container-name "$name" --limit 1 --format json | jq '.[0]')
            echo "Ревизия $name: $(printf '%s' "$rev" | jq -c '{id, created_at, log_options, resources, execution_timeout}')"
            group=$(printf '%s' "$rev" | jq -r '.log_options.log_group_id // empty')
            echo "::group::$name ($id) — последние $LOGS_MINUTES мин"
            if [ -n "$group" ]; then sel="--group-id=$group"; else sel="--group-name=default"; fi
            yc logging read "$sel" \
              --resource-ids "$id" --since "${LOGS_MINUTES}m" --limit 1000 \
              --format json | jq -r '.[] | [.timestamp, .level, (.message // "" | tostring), ((.json_payload // {}) | tostring)] | join(" | ")' \
              | tail -n 400 || echo "чтение журнала не удалось (роль logging.reader у сервисного аккаунта?)"
            echo "::endgroup::"
          done

      - name: Замер соединения со стендом (TLS и ответ)
        if: inputs.logs_minutes != ''
        run: |
          set -u
          URL=$(yc serverless container get --name "$CONTAINER_NAME" --format json | jq -r '.url')
          for i in $(seq 1 20); do
            curl -sS -m 90 -o /dev/null -w "#$i code=%{http_code} ip=%{remote_ip} tcp=%{time_connect} tls=%{time_appconnect} ttfb=%{time_starttransfer} total=%{time_total}\n" "${URL%/}/health" || true
          done

      - name: Сборка и push образов
        if: inputs.logs_minutes == ''
        run: |
          set -eu
          TAG="stand-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/service:$TAG"
          MOCK_IMAGE="cr.yandex/${YC_REGISTRY_ID}/neurodvs-mock:$TAG"
          docker login --username json_key --password-stdin cr.yandex < "$KEY_FILE"
          docker build -t "$IMAGE" .
          docker build -t "$MOCK_IMAGE" -f docker/mock.Dockerfile .
          docker push "$IMAGE"
          docker push "$MOCK_IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "MOCK_IMAGE=$MOCK_IMAGE" >> "$GITHUB_ENV"

      - name: Деплой заглушек ML и ТОиР
        if: inputs.logs_minutes == ''
        run: |
          set -eu
          . scripts/stand_lib.sh
          ML_URL=$(deploy_container "$ML_NAME" "$MOCK_IMAGE" 256MB 30s --environment MOCK_APP=mock_ml.app:app)
          TOIR_URL=$(deploy_container "$TOIR_NAME" "$MOCK_IMAGE" 256MB 30s --environment MOCK_APP=mock_toir.app:app)
          wait_health "$ML_URL"
          wait_health "$TOIR_URL"
          echo "ML_URL=$ML_URL" >> "$GITHUB_ENV"
          echo "TOIR_URL=$TOIR_URL" >> "$GITHUB_ENV"

      - name: Деплой основного контейнера
        if: inputs.logs_minutes == ''
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
          YANDEX_TTS_API_KEY: ${{ secrets.YANDEX_TTS_API_KEY }}
        run: |
          set -eu
          . scripts/stand_lib.sh
          # Адреса заглушек и служебные переменные — от workflow; ключи моделей — из секрета APP_ENV
          # (каждая строка KEY=VALUE — отдельный флаг --environment; запятая в значении ломает разбор yc).
          set -- \
            --environment "MOCK_ML_URL=${ML_URL%/}" \
            --environment "MOCK_TOIR_URL=${TOIR_URL%/}" \
            --environment MOCK_TIMEOUT=30 \
            --environment STATE_DB=/tmp/agent.db \
            --environment INDEX_DIR=/tmp/index
          if [ -n "${S3_BUCKET:-}" ]; then
            set -- "$@" --environment "S3_BUCKET=${S3_BUCKET}"
          else
            echo "::warning::vars.S3_BUCKET не задан — стенд без индекса руководств (поиск пуст, заявок нет)"
          fi
          # Голос (#14): ключ SpeechKit — из секрета, если его нет в APP_ENV; в браузер не попадает.
          case "${APP_ENV:-}" in
            *YANDEX_TTS_API_KEY=*) ;;
            *) [ -z "${YANDEX_TTS_API_KEY:-}" ] || set -- "$@" --environment "YANDEX_TTS_API_KEY=${YANDEX_TTS_API_KEY}" ;;
          esac
          # Каталог Yandex Cloud для эмбеддинга вопроса (поиск по смыслу); ключ YANDEX_API_KEY — в APP_ENV.
          case "${APP_ENV:-}" in
            *YANDEX_FOLDER_ID=*) ;;
            *) [ -z "${YANDEX_FOLDER_ID:-}" ] || set -- "$@" --environment "YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}" ;;
          esac
          case "${APP_ENV:-}" in
            *APP_SECRET=*) ;;
            # Ключ подписи разговора, общий для всех экземпляров: производный от секрета, сам секрет не раскрывает.
            *) set -- "$@" --environment "APP_SECRET=$(sha256sum "$KEY_FILE" | cut -c1-64)" ;;
          esac
          if [ -n "${APP_ENV:-}" ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              case "$line" in ''|'#'*) continue ;; esac
              case "$line" in
                MOCK_ML_URL=*|MOCK_TOIR_URL=*|S3_BUCKET=*|INDEX_DIR=*)
                  echo "APP_ENV: ${line%%=*} задаёт workflow — строка пропущена" >&2 ;;
                S3_ACCESS_KEY_ID=*|S3_SECRET_ACCESS_KEY=*)
                  echo "APP_ENV: ${line%%=*} — статический ключ в контейнер не кладём (D-9), строка пропущена" >&2 ;;
                *=*) set -- "$@" --environment "$line" ;;
                *) echo "APP_ENV: строка без '=' пропущена" >&2 ;;
              esac
            done <<< "$APP_ENV"
          fi
          URL=$(deploy_container "$CONTAINER_NAME" "$IMAGE" "$STAND_MEMORY" "$STAND_TIMEOUT" "$@")
          echo "STAND_URL=$URL" >> "$GITHUB_ENV"
          echo "Стенд: $URL"

      - name: Проверка /health и смоук сценариев без модели
        if: inputs.logs_minutes == ''
        run: |
          set -eu
          . scripts/stand_lib.sh
          wait_health "$STAND_URL"
          N=$(curl -fsS --max-time 30 "${STAND_URL}api/vehicles" | jq length)
          [ "$N" = 50 ] || { echo "stand: /api/vehicles вернул $N машин, ждали 50" >&2; exit 1; }
          diag() {
            curl -fsS --max-time 60 -X POST "${STAND_URL}api/diagnose" -H 'Content-Type: application/json' \
              -d "{\"vehicle_id\":\"$1\",\"session_id\":\"$2\"}"
          }
          C3=$(diag H142OX78 S-0113 | jq -r '[.status, .ticket_possible] | join(" ")')
          C1=$(diag M333YK47 S-0005 | jq -r '[.status, .ticket_possible] | join(" ")')
          echo "С3: $C3 · С1: $C1"
          [ "$C3" = "check_failed false" ] || { echo "stand: С3 — ждали check_failed без заявки" >&2; exit 1; }
          [ "$C1" = "anomaly true" ] || { echo "stand: С1 — ждали anomaly с возможной заявкой" >&2; exit 1; }
          KB=$(curl -fsS --max-time 30 "${STAND_URL}health" | jq -c '.manuals_index')
          echo "Индекс руководств: $KB"
          VOICE=$(curl -fsS --max-time 30 "${STAND_URL}health" | jq -r '.voice_key_present')
          [ "$VOICE" = true ] || echo "::warning::голос на стенде недоступен: нет YANDEX_TTS_API_KEY / YANDEX_API_KEY"
          FORGED=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "${STAND_URL}api/voice/speak" \
            -H 'Content-Type: application/json' -d "{\"text\":\"проверка\",\"sig\":\"$(printf '0%.0s' $(seq 64))\"}")
          [ "$FORGED" = 400 ] || { echo "stand: озвучка без подписи сервера должна давать 400, а не $FORGED" >&2; exit 1; }
          if [ -n "${S3_BUCKET:-}" ]; then
            [ "$(printf '%s' "$KB" | jq -r '.present')" = true ] || {
              echo "stand: индекс из бакета не скачан — роль storage.viewer у сервисного аккаунта? index/LATEST выложен?" >&2
              exit 1
            }
          fi
          {
            echo "### 🟢 Стенд"
            echo
            echo "- Сервис: ${STAND_URL}"
            echo "- Здоровье: ${STAND_URL}health"
            echo "- Заглушки: ML ${ML_URL} · ТОиР ${TOIR_URL}"
            echo "- Смоук через Mock ML: С3 → \`$C3\`, С1 → \`$C1\`"
            echo "- Индекс руководств: \`$KB\` · голос: ключ ${VOICE}, озвучка без подписи → ${FORGED}"
            echo "- Коммит: \`$(printf '%s' "$GITHUB_SHA" | cut -c1-7)\` · контейнер \`${CONTAINER_NAME}\` · тёплых экземпляров: ${STAND_MIN_INSTANCES}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: С1 на настоящей модели
        if: inputs.c1_live && inputs.logs_minutes == ''
        run: |
          set -eu
          pip install --quiet "httpx==0.28.1"
          python scripts/stand_c1.py "$STAND_URL" | tee "$RUNNER_TEMP/c1.txt"
          {
            echo
            echo "<details><summary>С1 на настоящей модели — ок</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/c1.txt"
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Голос на стенде как со страницы
        if: inputs.voice_live
        env:
          YANDEX_TTS_API_KEY: ${{ secrets.YANDEX_TTS_API_KEY }}
        run: |
          set -eu
          URL="${STAND_URL:-$(yc serverless container get --name "$CONTAINER_NAME" --format json | jq -r '.url')}"
          pip install --quiet "httpx==0.28.1"
          python scripts/stand_voice.py "$URL"

      - name: Убрать ключ
        if: always()
        run: rm -f "$RUNNER_TEMP/yc-sa-key.json"
