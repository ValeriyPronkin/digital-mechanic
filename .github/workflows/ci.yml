name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks смотрит всю историю
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv==0.12.24
      - name: Установить gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: make install
      - name: Материалы задачи (не в git, п. 9.1) — по ссылке из vars.TASK_MATERIALS_URL
        id: materials
        env:
          TASK_MATERIALS_URL: ${{ vars.TASK_MATERIALS_URL }}
        run: |
          set -eu
          if [ -z "$TASK_MATERIALS_URL" ]; then
            echo "::warning::vars.TASK_MATERIALS_URL не задан — тесты с заглушками и парком пропускаются (в итоге pytest — строка «ВНИМАНИЕ: пропущено …»)"
            echo "present=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/fetch_materials.py
          echo "present=1" >> "$GITHUB_OUTPUT"
      - run: make check

  web:
    name: Интерфейс v2 — тесты и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build  # tsc -b && vite build

  smoke:
    name: Смоук /health из чистого окружения
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Материалы задачи (не в git, п. 9.1) — по ссылке из vars.TASK_MATERIALS_URL
        id: materials
        env:
          TASK_MATERIALS_URL: ${{ vars.TASK_MATERIALS_URL }}
        run: |
          set -eu
          if [ -z "$TASK_MATERIALS_URL" ]; then
            echo "::warning::vars.TASK_MATERIALS_URL не задан — смоук пропущен: образам нужны заглушки и парк"
            echo "present=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/fetch_materials.py
          echo "present=1" >> "$GITHUB_OUTPUT"
      - if: steps.materials.outputs.present == '1'
        run: make smoke
