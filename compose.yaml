services:
  api:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Ключи берутся из .env (docker compose читает его сам); в образ не попадают.
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
      LLM_BUDGET_DAY_RUB: ${LLM_BUDGET_DAY_RUB:-100}
      LLM_BUDGET_TOTAL_RUB: ${LLM_BUDGET_TOTAL_RUB:-1000}
      LLM_PRICE_IN_RUB: ${LLM_PRICE_IN_RUB:-}
      LLM_PRICE_OUT_RUB: ${LLM_PRICE_OUT_RUB:-}
      # Внутри compose сервис ходит в заглушки по именам сервисов, а не по адресам из .env.
      MOCK_ML_URL: http://mock-ml:8001
      MOCK_TOIR_URL: http://mock-toir:8002
      # Материалы задачи вне git: после `make materials` они уже в образе; иначе контейнер скачает их сам.
      MATERIALS_URL: ${MATERIALS_URL:-}
      MATERIALS_TOKEN: ${MATERIALS_TOKEN:-}
    depends_on:
      mock-ml:
        condition: service_healthy
      mock-toir:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 3

  # Заглушки заказчика из vendor/neurodvs_mock (код не меняем, только образ).
  mock-ml:
    build:
      context: .
      dockerfile: docker/mock.Dockerfile
    environment:
      MOCK_APP: mock_ml.app:app
      PORT: "8001"
      MATERIALS_URL: ${MATERIALS_URL:-}
      MATERIALS_TOKEN: ${MATERIALS_TOKEN:-}
    ports:
      - "8001:8001"
    healthcheck: &mock-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      start_period: 15s
      interval: 5s
      timeout: 3s
      retries: 5

  mock-toir:
    build:
      context: .
      dockerfile: docker/mock.Dockerfile
    environment:
      MOCK_APP: mock_toir.app:app
      PORT: "8002"
      MATERIALS_URL: ${MATERIALS_URL:-}
      MATERIALS_TOKEN: ${MATERIALS_TOKEN:-}
    ports:
      - "8002:8002"
    healthcheck:
      <<: *mock-health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
