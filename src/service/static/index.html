<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сервис</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    code { background: #f2f2f2; padding: 0 .3rem; }
  </style>
</head>
<body>
  <h1>Сервис запущен</h1>
  <p>Статус: <code id="health">…</code></p>
  <script>
    fetch("/health").then(r => r.json()).then(h => {
      document.getElementById("health").textContent = h.status + " · v" + h.version;
    }).catch(() => { document.getElementById("health").textContent = "нет ответа"; });
  </script>
</body>
</html>
